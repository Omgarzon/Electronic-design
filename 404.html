  <script>
    // GitHub Pages serves this file for every unknown URL, at any depth, so the
    // link must be resolved from the path: /repo/a/b → /repo/, /repo/ → /repo/.
    (function () {
      var known = ['mission', 'payload', 'specs', 'model'];
      var segments = location.pathname.split('/').filter(Boolean);
      if (segments.length && known.indexOf(segments[segments.length - 1]) > -1) segments.pop();

      var base;
      if (/\.github\.io$/.test(location.hostname)) {
        // project site: the first segment is the repository name
        base = segments.length ? '/' + segments[0] + '/' : '/';
      } else {
        base = '/';
      }
      document.querySelectorAll('[data-home]').forEach(function (link) {
        link.setAttribute('href', base);
      });
    })();
  </script>
