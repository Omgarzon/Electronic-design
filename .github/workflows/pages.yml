name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # verify the build on every PR without deploying it
  pull_request:
    branches: [main]
  workflow_dispatch:

# Allow one concurrent deployment, cancelling unpushed builds in favour of the newest.
concurrency:
  group: pages
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    name: Build static site
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          lfs: true

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify vendored assets match package-lock
        run: |
          npm run vendor
          git diff --exit-code -- assets/vendor assets/fonts

      - name: Check references and decoders
        run: npm run check

      - name: Build _site
        run: npm run build

      - name: Configure Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v6

      - name: Upload artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    name: Deploy
    # PRs build and check the site, but only main publishes it
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
